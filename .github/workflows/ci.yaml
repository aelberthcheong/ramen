name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci-ing:
    name: type check then build
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v5

      - name: setup node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - name: install deps
        run: npm ci

      - name: type check
        run: npm run check

      - name: build
        run: npm run build
